models:

  - name: fam_bb_saerbidrag_inntekt
    description: "Tabell for inntekter knyttet til særbidragsvedtak."
    columns:
      - name: pk_bb_inntekt_saerbidrag
        description: "#NAVN Primærnøkkel særbidrag inntekt #INNHOLD Unik nøkkel for tabellen. #NAVN_EN Primary key #INNHOLD_EN Primary key for the table."
        tests:
          - not_null
          - unique
        data_type: raw
      - name: fk_bb_saerbidrag_fagsak
        description: "#NAVN Fremmednøkkel særbidrag fagsak #INNHOLD Syntetisk fremmednøkkel mot særbidragstabellen fam_bb_saerbidrag_fagsak. #NAVN_EN Foreign key fak_bb_saerbidrag  #INNHOLD_EN Foreign key for special contribution table fam_bb_saerbidrag_fagsak."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fam_bb_saerbidrag_fagsak')
                field: pk_bb_saerbidrag_fagsak
        data_type: raw
      - name: kafka_offset
        description: '{{ doc("kafka_offset") }}'
        data_type: number
      - name: saksnr
        description: '{{ doc("saksnr") }}'
        data_type: varchar2
      - name: vedtaks_id
        description: '{{ doc("vedtaks_id") }}'
        data_type: varchar2
      - name: vedtakstidspunkt
        description: '{{ doc("vedtakstidspunkt") }}'
        data_type: timestamp(0)
      - name: historisk_flagg
        description: '{{ doc("historisk_flagg") }}'
        data_type: number
      - name: inntekt_kategori
        description: "#NAVN Inntektskategori #INNHOLD Inntektens kategori."
        data_type: varchar2
      - name: type_inntekt
        description: "#NAVN Inntektstype #INNHOLD Inntektens type."
        data_type: varchar2
      - name: inntekt_for
        description: "#NAVN Inntekt gjelder for #INNHOLD Personen inntekten gjelder for, med verdiene p for pliktig, m for mottaker, k for kravhaver."
        data_type: char
      - name: inntekt_belop
        description: "#NAVN Inntektsbeløp #INNHOLD Inntekt i beløp. #NAVN_EN Income #INNHOLD_EN Income value."
        data_type: number
      - name: lastet_dato
        description:  '{{ doc("lastet_dato") }}'
        data_type: timestamp(6)

  - name: fam_bb_saerbidrag_fagsak
    description: "Tabell for særbidragsvedtak."
    columns:
      - name: pk_bb_saerbidrag_fagsak
        description: "#NAVN Primærnøkkel særbidrag fagsak #INNHOLD Unik nøkkel for tabellen. #NAVN_EN Primary key #INNHOLD_EN Primary key for the table."
        tests:
          - not_null
          - unique
        data_type: raw
      - name: kafka_offset
        description: '{{ doc("kafka_offset") }}'
        data_type: number
      - name: fk_bb_meta_data
        description: "#NAVN Fremmednøkkel kildetabell #INNHOLD Syntetisk fremmednøkkel mot kildetabellen. #NAVN_EN Synthetic key source #INNHOLD_EN Synthetic surrogate identifier to the source table."
        data_type: number
      - name: referanse
        description: "#NAVN Vedtakenes referanse #INNHOLD Unik referanse for vedtaket. #NAVN_EN Decision reference id #INNHOLD_EN Reference ID for the letter of decision."
        data_type: varchar2
      - name: vedtaks_id
        description: '{{ doc("vedtaks_id") }}'
        data_type: varchar2
      - name: vedtakstidspunkt
        description: '{{ doc("vedtakstidspunkt") }}'
        data_type: timestamp(0)
      - name: behandlings_type
        description: "#NAVN Vedtakets behandlingstype #INNHOLD Vedtakets type, for eksempel fastsettelse, endring eller klage. #NAVN_EN Decision processing type #INNHOLD_EN Type of case handling (e.g., assessment, modification, or appeal)."
        data_type: varchar2
      - name: kategori
        description: "#NAVN Kategori #INNHOLD Vedtakets kategori, for eksempel tannregulering. #NAVN_EN Decision category #INNHOLD_EN Category of the letter of decision (e.g., braces)."
        data_type: varchar2
      - name: saksnr
        description: '{{ doc("saksnr") }}'
        data_type: varchar2
      - name: fk_person1_skyldner
        description: "#NAVN Skyldners syntetiske nøkkel for dim_person #INNHOLD Syntetisk identifikator for skyldner. #NAVN_EN Synthetic key debtor to dim_person #INNHOLD_EN Synthetic surrogate identifier to dim_person for the debtor."
        data_type: number
      - name: fk_person1_kravhaver
        description: "#NAVN Kravhavers syntetiske nøkkel for dim_person #INNHOLD Syntetisk identifikator for kravhaver. #NAVN_EN Synthetic key child to dim_person #INNHOLD_EN Synthetic surrogate identifier to dim_person for the child."
        data_type: number
      - name: fk_person1_mottaker
        description: "#NAVN Mottakers syntetiske nøkkel for dim_person #INNHOLD Syntetisk identifikator for mottaker. #NAVN_EN Synthetic key recipient to dim_person #INNHOLD_EN Synthetic surrogate identifier to dim_person for the recipient."
        data_type: number
      - name: belop
        description: "#NAVN Beløp #INNHOLD Skyldners andel av godkjent beløp. #NAVN_EN Amount original currency #INNHOLD_EN The letter of decision financial amount in its original transaction currency."
        data_type: number
      - name: valuta_kode
        description: '{{ doc("valuta_kode") }}'
        data_type: varchar2
      - name: resultat
        description: "#NAVN Resultat #INNHOLD Vedtakets resultat, for eksempel innvilget eller avslag. #NAVN_EN Decision outcome #INNHOLD_EN The outcome of the decision (e.g., approved/granted or rejected)."
        data_type: varchar2
      - name: innkreving_flagg
        description: "#NAVN Innkrevingsflagg #INNHOLD Binær verdi som viser om vedtaket er registrert for innkreving via Skatt. #NAVN_EN Collection flag #INNHOLD_EN Binary value if the letter of decition is registered to be collected through an agency."
        data_type: number
      - name: omgjor_vedtaks_id
        description: "#NAVN Omgjøringsvedtak ID #INNHOLD Vedtak som er omgjort av dette vedtaket. #NAVN_EN Reversal id #INNHOLD_EN The letter of decision that has a reversal due to this letter of decision."
        data_type: varchar2
      - name: historisk_flagg
        description: '{{ doc("historisk_flagg") }}'
        data_type: number
      - name: krav_belop
        description: "#NAVN Kravbeløp #INNHOLD Beløpet mottaker ba om. #NAVN_EN Requested amount #INNHOLD_EN The financial amount originally requested by the recipient."
        data_type: number
      - name: godkjent_belop
        description: "#NAVN Godkjent beløp #INNHOLD Beløpet som ble godkjent av saksbehandler. #NAVN_EN Approved amount #INNHOLD_EN The final amount approved in the letter of decision."
        data_type: number
      - name: betalt_belop
        description: "#NAVN Betalt beløp #INNHOLD Beløpet som eventuelt er betalt tidligere av skyldner. #NAVN_EN Amount paid previously #INNHOLD_EN The amount that has already been paid previously by the debtor."
        data_type: number
      - name: lastet_dato
        description: '{{ doc("lastet_dato") }}'
        data_type: timestamp(6)
